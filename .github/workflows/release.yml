# Builds the app on Windows, macOS, Linux. Runs engine tests first.
# Push a tag like v0.1.0 to publish a GitHub Release with the three zips.
# "Run workflow" button (workflow_dispatch) builds zips as downloadable artifacts only.
name: build-and-release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
          - os: macos-latest
            name: macos
          - os: ubuntu-24.04
            name: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux build deps
        if: matrix.name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libx11-dev libxext-dev libxinerama-dev \
            libxrandr-dev libxcursor-dev libxi-dev libxrender-dev libxfixes-dev libfreetype-dev libfontconfig1-dev libgl1-mesa-dev

      # macOS: one binary for Apple Silicon and Intel Macs.
      - name: Configure
        shell: bash
        run: |
          if [ "${{ matrix.name }}" = "macos" ]; then
            cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"
          else
            cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          fi

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Engine tests
        shell: bash
        run: |
          test_bin=$(find build -type f \( -name "flashcard_engine_test" -o -name "flashcard_engine_test.exe" \) | head -n 1)
          echo "running $test_bin"
          "$test_bin"

      - name: Package
        shell: bash
        run: |
          mkdir -p dist/QuizMeFlashcards
          if [ "${{ matrix.name }}" = "windows" ]; then
            cp "build/flashcard_quiz_gui_artefacts/Release/Flashcard Quiz.exe" dist/QuizMeFlashcards/
          elif [ "${{ matrix.name }}" = "macos" ]; then
            cp -R "build/flashcard_quiz_gui_artefacts/Release/Flashcard Quiz.app" dist/QuizMeFlashcards/
            # ad-hoc signature (free). Not notarized, but macOS will not run a fully unsigned binary at all.
            codesign --force --deep -s - "dist/QuizMeFlashcards/Flashcard Quiz.app"
            codesign --verify --deep --verbose=2 "dist/QuizMeFlashcards/Flashcard Quiz.app"
          else
            cp "build/flashcard_quiz_gui_artefacts/Release/Flashcard Quiz" dist/QuizMeFlashcards/
          fi
          cp -R sample_decks dist/QuizMeFlashcards/
          cp README.md dist/QuizMeFlashcards/
          cd dist
          if [ "${{ matrix.name }}" = "windows" ]; then
            7z a "../QuizMeFlashcards-${{ matrix.name }}.zip" QuizMeFlashcards
          else
            zip -r -y "../QuizMeFlashcards-${{ matrix.name }}.zip" QuizMeFlashcards
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: QuizMeFlashcards-${{ matrix.name }}
          path: QuizMeFlashcards-${{ matrix.name }}.zip

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: zips
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: zips/*.zip
          generate_release_notes: true
